name: CI

on: [push, pull_request]

jobs:
  build_ps3:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          python dependencies/python/configure_build.py ps3 --ci
          dependencies/windows/ninja.exe
      - name: Build PKG
        run: |
          $sha_short="$(git rev-parse --short HEAD)".ToUpper()
          $content="RB3DXNITE"
          dependencies/windows/RB3DXBuildPkgPS3.exe out/ps3 usa ($content + $sha_short) .
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-PS3
          path: '*.pkg'

  build_ps3_char:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Merge assets into _ark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "_ark"
          Copy-Item -Path "rb3dx_assets/_ark/*" -Destination "_ark" -Recurse -Force
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build ARK
        run: |
          python dependencies/python/configure_build.py ps3 --ci --define CUSTOMCHARS
          dependencies/windows/ninja.exe
      - name: Build PKG
        run: |
          $sha_short="$(git rev-parse --short HEAD)".ToUpper()
          $content="RB3DXNITE"
          dependencies/windows/RB3DXBuildPkgPS3.exe out/ps3 usa ($content + $sha_short) .
      - name: Create character warning
        shell: bash
        run: |
          mkdir -p artifact
          cp *.pkg artifact/
          echo "Custom characters are still experimental! You may encounter bugs such as face deformation. This can be solved by making sure the stock RB character you are switching from matches the body type of the custom character. You can also set the characters on your profile on first boot." > artifact/"Please read before installing.txt"
          echo "Should you decide to uninstall the custom characters build, please make sure to remove any characters as stand-ins prior to updating or your game may crash!" >> artifact/"Please read before installing.txt"
      - name: Create character warning Spanish
        shell: bash
        run: |
          mkdir -p artifact
          echo "Los personajes custom todavía son experimentales, así que puedes tener deformaciones con caras. Puedes arreglar esto cambiando a un personaje "vanilla" de Rock Band con el mismo sexo del personaje custom. También puedes asignar personajes custom a tu banda como sustitutos para evitar este problema." > artifact/"ES - Lee antes de instalar.txt"
          echo "Si quieres borrar la versión de personajes custom, ¡por favor elimina cualquier personaje custom de la lista de sustitutos o juego puede crashear!" >> artifact/"ES - Lee antes de instalar.txt"
      - name: Create character warning Portuguese
        shell: bash
        run: |
          mkdir -p artifact
          echo "Os personagems personalizados ainda estão em fase de testes! Você pode encontrar, como o bug que deforma a face de certos personagens. Este erro pode ser resolvido se certificando que o personagem que você está trocando possui o mesmo gênero do personagem personalizado. Você também pode selecionar personagens do seu perfil como padrão." > artifact/"PT - Leia antes de instalar.txt"
          echo "Se você decidir desinstalar esta versão com personagens personalizados, certifique-se de remover qualquer personagem personalizado como substituto, ou o jogo irá crashar!" >> artifact/"PT - Leia antes de instalar.txt"
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: RB3DX-PS3-CustomCharacters
          path: |
            artifact